[build-system]
requires = ["setuptools>=77"]          # PEP 639 license-files
build-backend = "setuptools.build_meta"

[project]
name = "openobb"
dynamic = ["version"]                   # single source: openobb/__init__.py (__version__)
description = "OpenOBB: oriented-box (OBB) detection library for CAD drawings and aerial images"
readme = "README.md"
requires-python = ">=3.9"
license = "LicenseRef-Proprietary"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "LICENSES/*"]   # shipped in the wheel (Apache-2.0 s.4)
dependencies = [
    "torch>=2.3",
    "numpy",
    "opencv-python>=4.6",
    "shapely>=2.0",
    "scipy",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]
app = ["streamlit", "pandas"]
export = ["onnx>=1.16", "onnxscript>=0.3", "onnxruntime>=1.21"]   # openobb export + .onnx models; GPU: onnxruntime-gpu[cuda,cudnn]
sahi = ["sahi>=0.12"]                    # sliced inference with the SAHI calls of a YOLO service (openobb.sahi)

[project.scripts]
openobb = "openobb.cli:main"

[tool.setuptools.dynamic]
version = { attr = "openobb.__version__" }

[tool.setuptools.packages.find]
include = ["openobb", "openobb.*", "openobb_onnx"]   # + the ONNX runtime (handover wheel: tools/build_onnx_wheel.py)
