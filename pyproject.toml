[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "vrdet"
version = "0.1.0"
description = "VRDet: real-time oriented-box (OBB) detector, DETR-style, for CAD drawings and aerial images"
readme = "docs/FINETUNE.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
    "torch>=2.3",
    "numpy",
    "opencv-python>=4.6",
    "shapely>=2.0",
    "scipy",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]
app = ["streamlit", "pandas"]

[project.scripts]
vrdet = "vrdet.cli:main"

[tool.setuptools.packages.find]
include = ["vrdet*"]
