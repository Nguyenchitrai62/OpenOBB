[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "openobb"
dynamic = ["version"]                   # single source: openobb/__init__.py (__version__)
description = "OpenOBB: oriented-box (OBB) detection library for CAD drawings and aerial images"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
    "torch>=2.3",
    "numpy",
    "opencv-python>=4.6",
    "shapely>=2.0",
    "scipy",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]
app = ["streamlit", "pandas"]

[project.scripts]
openobb = "openobb.cli:main"

[tool.setuptools.dynamic]
version = { attr = "openobb.__version__" }

[tool.setuptools.packages.find]
include = ["openobb*"]
